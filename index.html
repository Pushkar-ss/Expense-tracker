<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>💰 Expense Tracker</h1>
            <p>Track your daily expenses easily</p>
        </header>

        <section class="summary">
            <div class="summary-card">
                <span>Total Expenses</span>
                <strong id="totalAmount">₹0.00</strong>
            </div>
            <div class="summary-card">
                <span>Total Records</span>
                <strong id="totalRecords">0</strong>
            </div>
        </section>

        <section class="form-card">
            <h2>Add Expense</h2>

            <form id="expenseForm">
                <div class="form-grid">
                    <div class="input-group">
                        <label for="id">ID</label>
                        <input type="number" id="id" min="1" required>
                    </div>

                    <div class="input-group">
                        <label for="category">Category</label>
                        <input type="text" id="category" placeholder="Food" required>
                    </div>

                    <div class="input-group">
                        <label for="amount">Amount (₹)</label>
                        <input type="number" id="amount" min="0" step="0.01" placeholder="200" required>
                    </div>

                    <div class="input-group">
                        <label for="date">Date</label>
                        <input type="date" id="date" required>
                    </div>

                    <div class="input-group full">
                        <label for="description">Description</label>
                        <input type="text" id="description" placeholder="Lunch with friends" required>
                    </div>
                </div>

                <button type="submit" class="add-btn">+ Add Expense</button>
            </form>
        </section>

        <section class="table-card">
            <div class="table-header">
                <h2>All Expenses</h2>
                <button id="clearBtn" class="clear-btn">Clear All</button>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Category</th>
                            <th>Amount</th>
                            <th>Date</th>
                            <th>Description</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="expenseTable"></tbody>
                </table>

                <div id="emptyMessage" class="empty">
                    No expenses found. Add your first expense above.
                </div>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
